name: Build AndUEDumper (Library Only - arm64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Fix Source Code Errors
      run: |
        cd AndUEDumper
        # Fix packageObj comparison
        sed -i 's/if (pkg.first == packageObj)/if (pkg.first == (unsigned char*)packageObj.GetAddress())/g' src/Dumper.cpp || true
        # Disable C++20 features in nlohmann/json to avoid char8_t issues
        # by forcing JSON_HAS_CPP_17 (prevents JSON_HAS_CPP_20 from being auto-defined)
        sed -i '/set(CMAKE_CXX_STANDARD 20)/a add_compile_definitions(JSON_HAS_CPP_17)' CMakeLists.txt || true
        # Ensure char8_t is enabled (needed by utfcpp)
        sed -i '/set(CMAKE_CXX_STANDARD 20)/a add_compile_options(-fchar8_t)' CMakeLists.txt || true

    - name: Build Library (arm64-v8a only)
      run: |
        cd AndUEDumper
        export NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        ABI=arm64-v8a
        echo "=================================="
        echo "CMake build - ABI $ABI (library only)"
        echo "=================================="

        cmake -S . -B "cmake_build/${ABI}" \
          -G "Ninja" \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="${NDK_HOME}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=$ABI \
          -DANDROID_PLATFORM=android-29 \
          -DANDROID_STL=c++_static \
          -DBUILD_SHARED=ON

        JOBS=$(($(nproc) / 2))
        [ $JOBS -lt 1 ] && JOBS=1
        cmake --build "cmake_build/${ABI}" -- -j${JOBS}

        echo ""
        echo "=== Build output ==="
        ls -la "cmake_build/${ABI}/"*.so 2>&1 || echo "No .so found, listing dir:"
        ls -la "cmake_build/${ABI}/" 2>&1 | head -20

    - name: Strip library
      run: |
        cd AndUEDumper
        STRIP=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
        for f in cmake_build/arm64-v8a/*.so; do
          if [ -f "$f" ]; then
            echo "Stripping $f ..."
            cp "$f" "$f.unstripped"
            $STRIP --strip-all "$f"
            echo "Original size: $(du -h "$f.unstripped" | cut -f1)"
            echo "Stripped size:  $(du -h "$f" | cut -f1)"
          fi
        done

    - name: Prepare release package
      run: |
        cd AndUEDumper
        mkdir -p release
        # Copy stripped .so
        for f in cmake_build/arm64-v8a/*.so; do
          if [ -f "$f" ]; then
            cp "$f" release/
          fi
        done
        ls -la release/

    - name: Upload Library Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndUEDumper-arm64-lib
        path: |
          AndUEDumper/release/
          AndUEDumper/cmake_build/arm64-v8a/*.so
        retention-days: 90
        if-no-files-found: error

    - name: Build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type**: Shared Library (for APK injection)" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: arm64-v8a only" >> $GITHUB_STEP_SUMMARY
        echo "- **NDK version**: r25c" >> $GITHUB_STEP_SUMMARY
        echo "- **No root required**: Reads memory from same process (getpid)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Output:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ls -la AndUEDumper/release/ >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
