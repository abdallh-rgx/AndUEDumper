name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Fix Source Code Errors
      run: |
        cd AndUEDumper
        sed -i 's/if (pkg.first == packageObj)/if (pkg.first == (unsigned char*)packageObj.GetAddress())/g' src/Dumper.cpp || true 
        sed -i '/set(CMAKE_CXX_STANDARD 20)/a add_compile_options(-fno-char8_t)' CMakeLists.txt || true

    - name: Run Project Build Script
      run: |
        cd AndUEDumper
        chmod +x build.sh
        export NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        echo 1 | ./build.sh

    - name: Upload Built Binary
      uses: actions/upload-artifact@v4
      with:
        name: AndUEDumper-Binaries
        path: |
          AndUEDumper/cmake_build/
          AndUEDumper/out/
